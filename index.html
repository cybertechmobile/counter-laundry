<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAUNDRY LAND - Work Manager</title>

<meta name="theme-color" content="#1f6feb">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- SPLASH -->
<div id="splash" class="splash">

    <div class="splash-logo">
        👕
    </div>

    <h1>LAUNDRY LAND</h1>

    <p>Work Manager</p>

    <small>
        Offline Ready ✓
    </small>

</div>


<!-- APP -->
<div id="app" class="app hidden">


<header class="header">

    <div>
        <h2 id="appName">
            LAUNDRY LAND
        </h2>

        <span id="connectionStatus">
            🟢 Offline Ready
        </span>
    </div>


    <button 
    class="icon-button"
    onclick="openSetting()"
    aria-label="Pengaturan">
        ⚙
    </button>


</header>



<main>


<!-- DASHBOARD -->

<section 
id="dashboardPage"
class="page active">


<h3>
Dashboard
</h3>


<div class="card-grid">


<div class="card">

<h4>
Total KG
</h4>

<strong id="totalKG">
0
</strong>

</div>



<div class="card">

<h4>
Total PCS
</h4>

<strong id="totalPCS">
0
</strong>

</div>



<div class="card highlight">

<h4>
Total Komisi
</h4>

<strong id="totalCommission">
Rp0
</strong>

</div>


</div>



<button 
class="primary-button"
onclick="showPage('workPage')">

+ Input Hasil Kerja

</button>


</section>





<!-- INPUT KERJA -->

<section 
id="workPage"
class="page">


<h3>
Input Hasil Kerja
</h3>



<div class="form-card">


<label>
Tanggal
</label>

<input 
id="workDate"
type="date">



<label>
Karyawan
</label>

<select id="employeeSelect">

<option>
Pilih Karyawan
</option>

</select>




<label>
Item Pekerjaan
</label>


<select id="itemSelect">

<option>
Pilih Item
</option>

</select>




<label>
Jumlah
</label>

<input
id="workQty"
type="number"
step="0.1"
placeholder="contoh 5">



<label>
Satuan
</label>

<input
id="workUnit"
readonly>




<div class="commission-box">

Komisi:

<strong id="previewCommission">
Rp0
</strong>

</div>




<button
class="primary-button"
onclick="saveWorkLog()">

Simpan Hasil Kerja

</button>


</div>


</section>





<!-- KARYAWAN -->

<section
id="employeePage"
class="page">


<h3>
Master Karyawan
</h3>


<div class="form-card">


<input
id="employeeName"
placeholder="Nama karyawan">


<button
class="primary-button"
onclick="saveEmployee()">

Tambah Karyawan

</button>


</div>



<div id="employeeList">

</div>


</section>






<!-- ITEM -->

<section
id="itemPage"
class="page">


<h3>
Master Item
</h3>



<div class="form-card">


<input
id="itemName"
placeholder="Nama pekerjaan">


<input
id="itemCode"
placeholder="Kode / alias">


<select id="itemUnit">

<option value="KG">
KG
</option>

<option value="PCS">
PCS
</option>

</select>



<button
class="primary-button"
onclick="saveItem()">

Tambah Item

</button>


</div>



<div id="itemList">

</div>


</section>






<!-- LAPORAN -->

<section
id="reportPage"
class="page">


<h3>
Laporan
</h3>


<div class="card">


<p>
Total pekerjaan hari ini:
</p>


<strong id="reportTotal">
0
</strong>


<p>
Total komisi:
</p>


<strong id="reportCommission">
Rp0
</strong>


</div>


</section>







<!-- SETTING -->

<section
id="settingPage"
class="page">


<h3>
Pengaturan
</h3>



<div class="form-card">


<label>
Nama Aplikasi
</label>

<input
id="settingName">



<label>

Tampilkan Komisi

</label>


<input
type="checkbox"
id="showCommission"
checked>



<button
class="primary-button"
onclick="saveSetting()">

Simpan Setting

</button>



<hr>


<button
class="secondary-button"
onclick="exportBackup()">

Backup Data

</button>



<input
type="file"
id="restoreFile"
accept=".json"
hidden>



<button
class="secondary-button"
onclick="document.getElementById('restoreFile').click()">

Restore Data

</button>



</div>


</section>


</main>






<!-- BOTTOM MENU -->

<nav class="bottom-nav">


<button onclick="showPage('dashboardPage')">

🏠
<br>
Home

</button>


<button onclick="showPage('workPage')">

📝
<br>
Kerja

</button>


<button onclick="showPage('employeePage')">

👥
<br>
Karyawan

</button>


<button onclick="showPage('itemPage')">

👕
<br>
Item

</button>


<button onclick="showPage('reportPage')">

📊
<br>
Laporan

</button>


</nav>



</div>





<script src="db.js"></script>

<script src="backup.js"></script>

<script src="app.js"></script>


</body>

</html>
